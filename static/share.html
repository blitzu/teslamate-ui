<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Urmărire în timp real</title>
<link rel="stylesheet" href="/share/leaflet.css">
<style>
html, body { height: 100%; margin: 0; background: #0b0d10; color: #eceff3; font: 16px/1.3 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
#map { position: absolute; inset: 0; }
#card { position: absolute; z-index: 1000; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); background: #14181dee; border-radius: 16px; padding: 14px 16px; backdrop-filter: blur(8px); max-width: 480px; margin: 0 auto; }
#card b { font-size: 22px; display: block; }
#card span { color: #9aa5b1; font-size: 14px; }
.dot { width: 14px; height: 14px; border-radius: 50%; background: #6fd6b8; border: 3px solid #fff; box-shadow: 0 0 0 4px #6fd6b855; }
</style>
</head>
<body>
<div id="map"></div>
<div id="card"><b id="t1">Se încarcă…</b><span id="t2"></span></div>
<script src="/share/leaflet.js"></script>
<script src="/share/app.js"></script>
</body>
</html>
