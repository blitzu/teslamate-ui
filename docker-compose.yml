# Requires Docker Compose v2.24+ (optional env_file entries).
# The UI joins the Docker network of your existing TeslaMate stack (see TESLAMATE_NETWORK in .env).
services:
  ui:
    build: .
    image: ghcr.io/blitzu/teslamate-ui:${APP_TAG:-latest}     # published by the Release workflow; `docker compose pull` updates it
    labels:
      com.centurylinklabs.watchtower.enable: "true"           # lets Watchtower (or a similar updater) keep it current, see docs/updates.md
    container_name: tessie-ui
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]   # only to hand /data to the app user and drop root
    mem_limit: 512m
    pids_limit: 256
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    env_file:
      - .env
      - path: .env.fleet      # created by scripts/set-fleet.sh
        required: false
      - path: .env.auth       # created by scripts/set-password.sh
        required: false
      - path: .env.access     # optional: Cloudflare Access (see docs/security.md)
        required: false
      - path: .env.notify     # optional: notification webhook (see docs/notifications.md)
        required: false
      - path: .env.ha         # optional: Home Assistant (BLE commands, solar share; see docs/home-assistant.md)
        required: false
      - path: .env.profiler   # optional: Profiler ingest token (see docs/profiler.md)
        required: false
    environment:
      TZ: ${TZ:-UTC}          # used by time-based automations
      PUBLIC_PORT: "4101"      # port INSIDE the container (host port is set with PUBLIC_PORT in .env / the ports mapping)
    volumes:
      - ./fleet/public-key.pem:/fleet/public-key.pem:ro     # keys generated by ./setup.sh
      - ./fleet/tls-cert.pem:/fleet/tls-cert.pem:ro        # the UI never mounts the private keys (only the proxy does)
      - ./data:/data          # OAuth tokens, notification settings, optional car.png
    ports:
      - "${UI_PORT:-4100}:4100"        # the app (LAN). Do NOT expose this port to the internet without protection.
      - "${PUBLIC_PORT:-4101}:4101"    # public listener: ONLY Tesla's public key + OAuth callback (point your HTTPS domain here)
    networks:
      - default
      - teslamate

  proxy:
    # Tesla's official signing proxy (teslamotors/vehicle-command), built from source at a pinned tag.
    build:
      context: .
      dockerfile: Dockerfile.proxy
    image: ghcr.io/blitzu/teslamate-ui-proxy:${APP_TAG:-latest}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    container_name: tessie-fleet-proxy
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    volumes:
      - ./fleet:/fleet:ro
    command: ["-tls-key", "/fleet/tls-key.pem", "-cert", "/fleet/tls-cert.pem", "-key-file", "/fleet/private-key.pem", "-host", "0.0.0.0", "-port", "4443"]

  updater:
    # Optional built-in updater for the "Update now" button and/or automatic updates (no Watchtower needed). See docs/updates.md.
    #   1) in .env:  UPDATER_TOKEN=<16+ random characters>   PROJECT_DIR=<absolute path of this folder>   UPDATE_WEBHOOK=http://updater:8080/update   UPDATE_TOKEN=<same token>
    #   2) docker compose --profile updater up -d updater
    # It mounts the Docker socket (root-equivalent on the host) but only runs `docker compose pull/up` for the services listed in UPDATER_SERVICES, and publishes no port.
    profiles: ["updater"]
    build:
      context: .
      dockerfile: Dockerfile.updater
    image: ghcr.io/blitzu/teslamate-ui-updater:${APP_TAG:-latest}
    container_name: tessie-updater
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]       # read .env and the env files whatever their owner
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    environment:
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}          # the updater refuses to start without it (min. 16 characters)
      PROJECT_DIR: ${PROJECT_DIR:-/opt/teslamate-ui}
      UPDATER_SERVICES: ${UPDATER_SERVICES:-ui proxy}
      UPDATER_AUTO_HOURS: ${UPDATER_AUTO_HOURS:-0}   # 0 = only when you press the button; e.g. 24 = update by itself once a day
    working_dir: ${PROJECT_DIR:-/opt/teslamate-ui}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PROJECT_DIR:-/opt/teslamate-ui}:${PROJECT_DIR:-/opt/teslamate-ui}   # same path as on the host: compose resolves ./data etc. from it

  demo:
    # Optional public demo with fictional data: docker compose --profile demo up -d demo
    profiles: ["demo"]
    build: .
    container_name: tessie-ui-demo
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    environment:
      DEMO_ONLY: "1"
      PORT: "4100"
    ports:
      - "${DEMO_PORT:-4102}:4100"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - demo

networks:
  demo: {}
  teslamate:
    external: true
    name: ${TESLAMATE_NETWORK:-teslamate_default}
