name: Release
# Push a tag like v1.2.0 (it must equal "v" + the content of VERSION) and this workflow tests, publishes the container images
# to ghcr.io and creates the GitHub release whose text is the matching section of CHANGELOG.md.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match VERSION and CHANGELOG.md
        run: |
          VER="$(cat VERSION)"
          test "v$VER" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != VERSION v$VER"; exit 1; }
          grep -qE "^## $VER( |$)" CHANGELOG.md || { echo "CHANGELOG.md has no '## $VER' section"; exit 1; }
          awk -v v="$VER" '/^## /{ if (f) exit; if ($2 == v) { f = 1; next } } f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "empty release notes"; exit 1; }
          echo "VER=$VER" >> "$GITHUB_ENV"
          case "$VER" in *-*) echo "PRE=1" >> "$GITHUB_ENV";; esac     # 1.6.0-rc1: pre-release, never becomes :latest
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tests
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build and push the app image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: BUILD_COMMIT=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ env.VER }}
      - name: Build and push the signing proxy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.proxy
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}-proxy:${{ env.VER }}
      - name: Build and push the updater image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.updater
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}-updater:${{ env.VER }}
      - name: Move :latest to this version (only after all three images were pushed)
        if: env.PRE == ''
        run: |
          for n in "" -proxy -updater; do
            docker buildx imagetools create -t "$IMAGE$n:latest" "$IMAGE$n:$VER"
          done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "v$VER" --notes-file notes.md ${PRE:+--prerelease}
